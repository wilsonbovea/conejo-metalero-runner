<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#1c1c1e"/>

  <!-- tail -->
  <circle cx="128" cy="360" r="26" fill="#f7f3ec"/>

  <!-- back ear -->
  <g transform="translate(200,60) rotate(-12)">
    <rect x="0" y="0" width="46" height="150" rx="23" fill="#f7f3ec"/>
    <rect x="12" y="24" width="22" height="96" rx="11" fill="#f4a6c1"/>
  </g>
  <!-- front ear -->
  <g transform="translate(268,50) rotate(10)">
    <rect x="0" y="0" width="46" height="158" rx="23" fill="#f7f3ec"/>
    <rect x="12" y="26" width="22" height="102" rx="11" fill="#f4a6c1"/>
  </g>

  <!-- mohawk -->
  <g fill="#e0263f">
    <polygon points="214,150 226,90 238,150"/>
    <polygon points="240,150 256,78 272,150"/>
    <polygon points="274,150 286,90 298,150"/>
  </g>

  <!-- head -->
  <circle cx="256" cy="230" r="98" fill="#f7f3ec"/>
  <circle cx="284" cy="270" r="24" fill="#f4a6c1" opacity="0.55"/>

  <!-- sunglasses -->
  <rect x="196" y="205" width="150" height="46" rx="18" fill="#111111"/>
  <rect x="206" y="212" width="58" height="32" rx="10" fill="#3a3a3d"/>
  <rect x="272" y="212" width="58" height="32" rx="10" fill="#3a3a3d"/>

  <!-- snout + nose -->
  <circle cx="326" cy="262" r="34" fill="#f7f3ec"/>
  <circle cx="352" cy="256" r="15" fill="#e0507a"/>

  <!-- jacket collar -->
  <rect x="196" y="322" width="120" height="40" rx="18" fill="#1c1c1e" stroke="#3a3a3d" stroke-width="4"/>
  <circle cx="222" cy="342" r="6" fill="#c9c9cf"/>
  <circle cx="248" cy="342" r="6" fill="#c9c9cf"/>
</svg>
